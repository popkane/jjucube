<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17402f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>루미뀨브</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 시작 화면 -->
<section id="home" class="screen">
  <div class="home-inner">
    <h1 class="logo" aria-label="루미뀨브">
      <span class="tile c-r"><span>루</span></span><span class="tile c-b"><span>미</span></span><span class="tile c-y"><span>뀨</span></span><span class="tile c-k"><span>브</span></span>
    </h1>

    <div id="homeMain" class="stack">
      <label class="field">
        <span class="label">내 이름</span>
        <input id="myName" class="text-input" maxlength="8" placeholder="이름">
      </label>
      <button id="resumeBtn" class="btn primary wide" hidden>이어하기</button>
      <div class="modes">
        <button class="mode-card" id="createCard">
          <b>방 만들기</b><small>방 번호를 만들어 상대에게 알려줘요 (2~4명)</small>
        </button>
        <button class="mode-card" id="joinCard">
          <b>방 들어가기</b><small>받은 방 번호 4자리를 넣어요</small>
        </button>
        <button class="mode-card" disabled>
          <b>컴퓨터와 1:1</b><small>준비 중</small>
        </button>
      </div>
    </div>

    <form id="createForm" class="stack" hidden>
      <div class="field">
        <span class="label">최대 인원</span>
        <div class="seg" data-name="players">
          <button type="button" data-v="2" class="on">2명</button><button type="button" data-v="3">3명</button><button type="button" data-v="4">4명</button>
        </div>
      </div>
      <div class="field">
        <span class="label">한 차례 제한 시간</span>
        <div class="seg" data-name="seconds">
          <button type="button" data-v="60" class="on">60초</button><button type="button" data-v="90">90초</button><button type="button" data-v="120">120초</button>
        </div>
      </div>
      <button type="submit" class="btn primary wide">방 만들기</button>
      <button type="button" class="btn ghost wide back-btn">뒤로</button>
    </form>

    <form id="joinForm" class="stack" hidden>
      <label class="field">
        <span class="label">방 번호</span>
        <input id="joinCode" class="text-input code-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off">
      </label>
      <button type="submit" class="btn primary wide">들어가기</button>
      <button type="button" class="btn ghost wide back-btn">뒤로</button>
    </form>

    <p id="connState" class="muted center">연결 중…</p>
  </div>
</section>

<!-- 대기실 -->
<section id="lobby" class="screen" hidden>
  <div class="home-inner">
    <p class="label center">방 번호</p>
    <div id="lobbyCode" class="room-code"></div>
    <p class="muted center">상대에게 이 번호를 알려주세요</p>
    <ul id="lobbySeats" class="seats"></ul>
    <p id="lobbyInfo" class="muted center"></p>
    <button id="startBtn" class="btn primary wide" hidden>시작</button>
    <button id="leaveLobbyBtn" class="btn ghost wide">나가기</button>
  </div>
</section>

<!-- 게임 화면 -->
<section id="game" class="screen" hidden>
  <header class="hud">
    <button id="menuBtn" class="icon-btn" aria-label="메뉴">≡</button>
    <div id="players" class="players"></div>
    <div class="pool" title="남은 타일"><span id="poolCount">0</span><small>남음</small></div>
  </header>

  <div class="table-wrap">
    <main id="table" class="table"></main>
    <button id="tidyBtn" class="tidy-btn" hidden>정돈</button>
  </div>

  <footer class="dock">
    <div class="timer"><div id="timerBar" class="timer-bar"></div><span id="timerText" class="timer-text"></span></div>
    <div id="status" class="status"></div>
    <div id="rack" class="rack" data-drop="rack"></div>
    <div class="controls">
      <button id="undoBtn" class="btn">되돌리기</button>
      <button id="sortBtn" class="btn">숫자순</button>
      <button id="mainBtn" class="btn primary">1장 받기</button>
    </div>
  </footer>
</section>

<!-- 메뉴 -->
<div id="menu" class="overlay" hidden>
  <div class="sheet">
    <h2>메뉴</h2>
    <p id="menuRoom" class="muted"></p>
    <button id="menuClose" class="btn primary wide">계속하기</button>
    <button id="soundBtn" class="btn wide sound-btn">소리: 켜짐</button>
    <button id="menuQuit" class="btn danger wide">방 나가기</button>
  </div>
</div>

<!-- 게임 끝 -->
<div id="end" class="overlay" hidden>
  <div class="sheet">
    <h2 id="endTitle"></h2>
    <table class="scores">
      <thead><tr><th>이름</th><th>남은 타일</th><th>이번 판</th><th>누적</th></tr></thead>
      <tbody id="endRows"></tbody>
    </table>
    <button id="againBtn" class="btn primary wide">한 판 더</button>
    <p id="againInfo" class="muted" hidden>방장이 한 판 더 시작할 수 있어요</p>
    <button id="homeBtn" class="btn ghost wide">방 나가기</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
